<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>OpenHand OS</title>
<link rel="stylesheet" href="style.css">

<style>
/* -------- LOCK SCREEN -------- */

#lockscreen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #111, #222);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.loginBox {
    background: #1e1e1e;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    color: white;
    width: 260px;
}

.loginBox h2 {
    margin-top: 0;
}

.loginBox input {
    width: 100%;
    padding: 10px;
    font-size: 18px;
    text-align: center;
    border-radius: 10px;
    border: none;
    margin-top: 10px;
}

.loginBox button {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    border-radius: 12px;
    border: none;
    background: #4cafef;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

#pinError {
    margin-top: 10px;
    color: #ff6b6b;
}

/* -------- SHUTDOWN BUTTON -------- */

#shutdownbtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 18px;
    font-size: 16px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    background-color: #ff5b5b;
    color: white;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    transition: transform 0.15s ease;
}

#shutdownbtn:active {
    transform: scale(0.95);
}
</style>

</head>

<body>

<!-- ===== LOCK SCREEN ===== -->

<div id="lockscreen">
  <div class="loginBox">
    <h2>OpenHand OS</h2>
    <p>Entrez le code PIN</p>
    <input type="password" id="pinInput" maxlength="6">
    <button onclick="checkPin()">Connexion</button>
    <div id="pinError"></div>
  </div>
</div>

<!-- ===== OS ===== -->

<div id="curseur"></div>

<div id="topbar">
  <div class="logo">OpenHand</div>
  <div id="clock"></div>
</div>

<div id="desktop"></div>

<div id="appWindow">
  <button id="backBtn" onclick="closeApp()">← Retour</button>
  <iframe id="appFrame"></iframe>
</div>

<audio id="music" src="musique.mp3"></audio>

<button id="shutdownbtn">Eteindre l'ordinateur</button>

<!-- ===== SCRIPTS ===== -->

<script>
/* ---------- PIN LOGIN ---------- */

const PIN_CODE = "1234"; // change ici

function checkPin() {
    const val = document.getElementById("pinInput").value;

    if (val === PIN_CODE) {
        document.getElementById("lockscreen").style.display = "none";

        // lance la musique après interaction (autorisé navigateur)
        const music = document.getElementById("music");
        music.play().catch(()=>{});

    } else {
        document.getElementById("pinError").textContent = "Code incorrect";
    }
}

/* ---------- SHUTDOWN BUTTON ---------- */

const shutdownBtn = document.getElementById('shutdownbtn');

shutdownBtn.addEventListener('click', () => {
    alert("Ordinateur éteint ! ✅");

    // ferme les apps ouvertes
    document.querySelectorAll('iframe').forEach(f => f.remove());

    // remet l'écran de login
    document.getElementById("lockscreen").style.display = "flex";

    // stop musique
    const music = document.getElementById("music");
    music.pause();
    music.currentTime = 0;
});
</script>

<script src="main.js"></script>

</body>
</html>
