<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>OpenHand OS</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="topbar">
  <div class="logo">OpenHand</div>
  <div id="clock"></div>
</div>

<div id="desktop"></div>

<div id="appWindow">
  <button id="backBtn" onclick="closeApp()">← Retour</button>
  <iframe id="appFrame"></iframe>
</div>

<!-- Place le bouton en haut à droite du launcher ou dans le header -->
<button id="shutdownbtn">Se déconnecter</button>

<script>
// Pour l'instant, juste une action web-safe
const logoutBtn = document.getElementById('shutdownbtn');
shutdownbtn.addEventListener('click', () => {
    alert("Ordinateur éteint ! ✅");
    // Ici tu peux revenir au launcher ou réinitialiser le DOM
    // Exemple : fermer toutes les apps ouvertes
    document.querySelectorAll('iframe').forEach(f => f.remove());
});
</script>

<style>
#shutdownbtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 18px;
    font-size: 16px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    background-color: #ff5b5b;
    color: white;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    transition: transform 0.15s ease;
}
#logoutBtn:active {
    transform: scale(0.95);
}
</style>


<script src="main.js"></script>
</body>
</html>
