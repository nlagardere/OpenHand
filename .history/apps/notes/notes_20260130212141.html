<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Notes - OpenHand</title>
<style>
body {
  margin:0;
  height:100vh;
  font-family:system-ui, sans-serif;
  background: linear-gradient(180deg,#f9f9f9,#e4f0ff);
  display:flex;
  flex-direction:column;
}

#notesHeader {
  padding:20px;
  background:#b05bff;
  color:white;
  font-size:22px;
  font-weight:600;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

#notesArea {
  flex:1;
  padding:20px;
  background:white;
  margin:20px;
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
  font-size:18px;
  line-height:1.5;
  resize:none;
  border:none;
  outline:none;
}
</style>
</head>
<body>

<div id="notesHeader">Mes Notes</div>
<textarea id="notesArea" placeholder="Écris ici..."></textarea>

<script>
const area = document.getElementById('notesArea');

// Charger les notes depuis localStorage
area.value = localStorage.getItem('openhand_notes') || '';

// Sauvegarde automatique
area.addEventListener('input', ()=>{
  localStorage.setItem('openhand_notes', area.value);
});
</script>

</body>
</html>
