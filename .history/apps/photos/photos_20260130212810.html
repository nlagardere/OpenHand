<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Photos - OpenHand</title>
<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  font-family: system-ui, sans-serif;
  background: linear-gradient(180deg,#f6f8ff,#e0e8ff);
}

header {
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:#5b7cff;
  color:white;
  font-size:22px;
  font-weight:600;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

#selectFolder {
  padding:10px 16px;
  font-size:16px;
  border-radius:14px;
  border:none;
  cursor:pointer;
}

#gallery {
  flex:1;
  padding:16px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:12px;
  overflow-y:auto;
}

#gallery img {
  width:100%;
  border-radius:14px;
  cursor:pointer;
  transition: transform 0.25s ease;
}

#gallery img:active {
  transform:scale(0.95);
}

/* Modal pour zoom */
#modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

#modal img {
  max-width:90%;
  max-height:90%;
  border-radius:20px;
  touch-action: pan-y pinch-zoom;
}
</style>
</head>
<body>

<header>
  Photos
  <button id="selectFolder">Choisir un dossier</button>
</header>

<div id="gallery"></div>

<div id="modal">
  <img id="modalImg" src="">
</div>

<script>
const gallery = document.getElementById('gallery');
const selectBtn = document.getElementById('selectFolder');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');

let selectedFiles = [];

// Sélection d’un dossier complet
selectBtn.addEventListener('click', async () => {
  gallery.innerHTML = '';
  try {
    const dirHandle = await window.showDirectoryPicker();

    for await (const entry of dirHandle.values()) {
      if (entry.kind === 'file' && entry.name.match(/\.(jpe?g|png|gif|webp)$/i)) {
        const file = await entry.getFile();
        selectedFiles.push(file);

        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        gallery.appendChild(img);

        // Zoom en modal
        img.addEventListener('click', () => {
          modalImg.src = img.src;
          modal.style.display = 'flex';
        });
      }
    }
  } catch(err) {
    console.error(err);
  }
});

// Fermer modal
modal.addEventListener('click', () => {
  modal.style.display = 'none';
});

// Gestes tactiles simples : pinch-zoom sur mobile
let initialDistance = 0;
modalImg.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const distance = Math.hypot(dx, dy);

    if (initialDistance === 0) {
      initialDistance = distance;
    } else {
      const scale = distance / initialDistance;
      modalImg.style.transform = `scale(${scale})`;
    }
  }
});

modalImg.addEventListener('touchend', () => {
  initialDistance = 0;
  modalImg.style.transform = 'scale(1)';
});
</script>

</body>
</html>
